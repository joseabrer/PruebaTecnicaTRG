# Ejecución local del microservicio y de su base de datos. El único requisito es Docker:
#
#   docker compose up --build
#
# API y Swagger:  http://localhost:8080/swagger
#   - Si el puerto 8080 está ocupado: API_PORT=9090 docker compose up --build
# Borrar los datos:  docker compose down -v

name: gtmotive-renting

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    # Su puerto no se publica en el host a propósito: evita choques con un MongoDB que ya pueda
    # estar instalado ahí. La API llega a él por la red del compose (host "mongo").
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Development es el perfil que no necesita Azure (Key Vault, Application Insights).
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      MongoDb__ConnectionString: mongodb://mongo:27017/?serverSelectionTimeoutMS=5000
      MongoDb__MongoDbDatabaseName: rental
    # Publicado solo en esta máquina (127.0.0.1): la API no tiene autenticación, así que no debe ser accesible desde la red.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  mongo-data:
