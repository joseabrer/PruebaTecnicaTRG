# Local run of the microservice and its database. The only requirement is Docker:
#
#   docker compose up --build
#
# API and Swagger:  http://localhost:8080/swagger
#   - If the port 8080 is taken: API_PORT=9090 docker compose up --build
# Reset the data:   docker compose down -v

name: gtmotive-renting

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    # Its port is not published on the host on purpose: it avoids clashes with a MongoDB that may
    # already be installed there. The API reaches it through the compose network (host "mongo").
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Development is the profile that does not need Azure (Key Vault, Application Insights).
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      MongoDb__ConnectionString: mongodb://mongo:27017/?serverSelectionTimeoutMS=5000
      MongoDb__MongoDbDatabaseName: rental
    # Published only on this machine (127.0.0.1): the API has no authentication, so it must not be reachable from the network.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  mongo-data:
